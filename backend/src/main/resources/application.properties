spring.application.name=easy-car-rent-api

spring.datasource.url=jdbc:postgresql://localhost:5432/easy_car_rent_db
spring.datasource.username=easy_car_rent_user
spring.datasource.password=easy_car_rent_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080